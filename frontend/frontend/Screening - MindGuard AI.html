    <div class="max-w-4xl mx-auto py-8 px-4 sm:px-6 lg:px-8">

            <div class="mb-8">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-gray-700">Progress</span>
                    <span class="text-sm text-gray-500" id="progress-text">1/5</span>
                </div>
                <div class="w-full bg-gray-200 rounded-full h-2">
                    <div class="progress-bar bg-indigo-600 h-2 rounded-full" style="width: 20%"></div>
                </div>
            </div>

            <!-- Current Task -->
            <div id="task-container">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-4">Memory Recall Test</h2>
                    <p class="text-gray-600 mb-6">Please remember these three words: Apple, Table, River</p>
                    
                    <div class="speech-visualizer" id="visualizer"></div>
                    
                    <button id="record-btn" class="bg-indigo-600 text-white px-8 py-4 rounded-full text-lg font-medium hover:bg-indigo-700 transition-colors">

                        Start Recording
                    </button>
                    
                    <p class="text-sm text-gray-500 mt-4">Click to record your response</p>
                </div>
            </div>

            <!-- Analysis Indicators -->
            <div id="analysis-indicators" class="hidden mt-8">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

                        <p class="text-lg font-bold text-indigo-600" id="response-time">Analyzing...</p>
                    </div>

                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-activity h-8 w-8 text-indigo-600 mx-auto mb-2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline></svg>

                        <p class="text-lg font-bold text-indigo-600" id="fluency-score">Analyzing...</p>
                    </div>
                    <div class="text-center p-4 bg-indigo-50 rounded-lg">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-alert-circle h-8 w-8 text-indigo-600 mx-auto mb-2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
                        <p class="text-sm font-medium text-gray-700">Detected Patterns</p>
                        <p class="text-lg font-bold text-indigo-600" id="patterns">Analyzing...</p>
                    </div>
                </div>
            </div>

            <!-- Navigation Buttons -->
            <div class="flex justify-between mt-8">
                <button id="prev-btn" class="bg-gray-300 text-gray-700 px-6 py-2 rounded-md hover:bg-gray-400 transition-colors" disabled="">
                    Previous
                </button>
                <button id="next-btn" class="bg-indigo-600 text-white px-6 py-2 rounded-md hover:bg-indigo-700 transition-colors">
                    Next Task
                </button>
            </div>
        </div>
    </div>

    <script>
        feather.replace();
        
        // Screening state management
        const tasks = [
            {
                title: "Memory Recall Test",
                instructions: "Please remember these three words: Apple, Table, River",
                expectedWords: ["apple", "table", "river"]
            },
            {
                title: "Verbal Fluency",
                instructions: "Name as many animals as you can in 30 seconds",
                category: "animals"
            },
            {
                title: "Clock Drawing",
                instructions: "Draw a clock showing 10:45"
            },
            {
                title: "Story Recall",
                instructions: "Listen to this short story and then repeat it back"
            },
            {
                title: "Word Association",
                instructions: "What comes to mind when you hear these words?"
            }
        ];

        let currentTask = 0;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        // DOM Elements
        const progressBar = document.querySelector('.progress-bar');
        const progressText = document.getElementById('progress-text');
        const recordBtn = document.getElementById('record-btn');
        const visualizer = document.getElementById('visualizer');
        const analysisIndicators = document.getElementById('analysis-indicators');
        const nextBtn = document.getElementById('next-btn');
        const prevBtn = document.getElementById('prev-btn');

        // Update progress
        function updateProgress() {
            const progress = ((currentTask + 1) / tasks.length) * 100;
            progressBar.style.width = `${progress}%`;
            progressText.textContent = `${currentTask + 1}/${tasks.length}`;
        }

        // Load current task
        function loadTask() {
            const task = tasks[currentTask];
            document.querySelector('#task-container h2').textContent = task.title;
            document.querySelector('#task-container p').innerHTML = task.instructions;
            
            updateProgress();
            prevBtn.disabled = currentTask === 0;
        }

        // Speech recording
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                mediaRecorder.ondataavailable = (event) => {
                    audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/wav' });
                    await analyzeAudio(audioBlob);
                };

                mediaRecorder.start();
                isRecording = true;
                recordBtn.innerHTML = '<i data-feather="square" class="inline mr-2"></i> Stop Recording';
                recordBtn.classList.add('recording-active');
                feather.replace();
            } catch (error) {
                console.error('Error accessing microphone:', error);
                alert('Please allow microphone access to continue with the screening.');
            }
        }

        function stopRecording() {
            if (mediaRecorder && isRecording) {
                mediaRecorder.stop();
                isRecording = false;
                recordBtn.innerHTML = '<i data-feather="mic" class="inline mr-2"></i> Start Recording';
                recordBtn.classList.remove('recording-active');
                feather.replace();
            }
        }

        // Audio analysis (simulated)
        async function analyzeAudio(audioBlob) {
            // Show analysis indicators
            analysisIndicators.classList.remove('hidden');
            
            // Simulate AI processing
            setTimeout(() => {
                document.getElementById('response-time').textContent = '2.4s';
                document.getElementById('fluency-score').textContent = '86%';
                document.getElementById('patterns').textContent = '1 alert';
            }, 2000);

            // Send to backend for real analysis
            const formData = new FormData();
            formData.append('audio', audioBlob);
            formData.append('task', currentTask);
            formData.append('userId', 'current-user');

            try {
                const response = await fetch('/api/analyze-speech', {
                    method: 'POST',
                    body: formData
                });
                
                const results = await response.json();
                console.log('Analysis results:', results);
            } catch (error) {
                console.error('Error analyzing audio:', error);
            }
        }

        // Event listeners
        recordBtn.addEventListener('click', () => {
            if (!isRecording) {
                startRecording();
            } else {
                stopRecording();
            }
        });

        nextBtn.addEventListener('click', () => {
            if (currentTask < tasks.length - 1) {
                currentTask++;
                loadTask();
                analysisIndicators.classList.add('hidden');
            } else {
                window.location.href = 'results.html';
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentTask > 0) {
                currentTask--;
                loadTask();
                analysisIndicators.classList.add('hidden');
            }
        });

        // Initialize
        loadTask();
    </script>
